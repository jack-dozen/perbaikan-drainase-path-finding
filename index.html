<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pencari Jalur Tercepat · Graf Jalan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#17212b;--mute:#5d6b79;--line:#d5dbe2;--road:#9aa6b3;--node:#cfe0f1;--route:#d6246e;--start:#0b8a62;--end:#1f4fd1;--warn:#b42318;--halo:#eef1f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--panel:#1a222c;--ink:#e8edf2;--mute:#9aa8b6;--line:#2c3744;--road:#5d6b79;--node:#2a4260;--route:#ff5c9a;--start:#2fd39e;--end:#6b94ff;--warn:#ff8a80;--halo:#10161d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--panel:#1a222c;--ink:#e8edf2;--mute:#9aa8b6;--line:#2c3744;--road:#5d6b79;--node:#2a4260;--route:#ff5c9a;--start:#2fd39e;--end:#6b94ff;--warn:#ff8a80;--halo:#10161d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:210px}
button{min-width:0;cursor:pointer;font-weight:600}
button:hover{border-color:var(--route)}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.opt{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:400}
fieldset{border:0;margin:0;padding:0;display:flex;gap:14px;align-items:center;font-size:14px}
fieldset legend{float:left;margin-right:10px;font-size:13px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block}
.hint{font-size:13px;color:var(--mute);margin:6px 4px 0}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tot{display:flex;gap:22px;align-items:flex-end;margin-bottom:10px}
.tot small{display:block;color:var(--mute);font-size:12px;font-weight:600}
ol{margin:0;padding:0;list-style:none}
li{padding:9px 0;border-top:1px solid var(--line)}
li b{font-weight:600}
li span{display:block;color:var(--mute);font-size:13px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;margin-right:4px}
.err{color:var(--warn);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin:8px 4px 0}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
text{font-family:inherit}
.nd{cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Pencari jalur tercepat</h1>
<p class="sub">Pilih titik awal dan tujuan, jalurnya langsung dihitung dengan algoritma Dijkstra.</p>

<div class="bar">
<label>Titik awal<select id="s"></select></label>
<label>Tujuan<select id="e"></select></label>
<button id="swap" type="button">Tukar</button>
<fieldset><legend>Bobot</legend>
<label class="opt"><input type="radio" name="m" value="w" checked>Waktu (menit)</label>
<label class="opt"><input type="radio" name="m" value="d">Jarak (meter)</label>
</fieldset>
<label class="opt"><input type="checkbox" id="xx">Abaikan kondisi ruas xx (anggap jalan normal)</label>
</div>

<div class="grid">
<div class="card">
<svg id="g" viewBox="0 0 1000 640" role="img" aria-label="Graf jaringan jalan"></svg>
<p class="hint">Klik simpul di peta untuk memilih awal, lalu tujuan. Klik lagi untuk memulai ulang.</p>
<div class="leg"><span><i style="background:var(--start)"></i>Awal</span><span><i style="background:var(--end)"></i>Tujuan</span><span><i style="background:var(--route)"></i>Jalur tercepat</span><span>Garis putus-putus merah: ruas tertutup</span></div>
</div>
<div class="card" id="res" aria-live="polite"></div>
</div>
</main>
<script>
const D={"n":[["rumah mail",707,50],["pertigaan gang awi",907,97],["pertigaan pemkot-ciawitali",920,221],["pertigaan nasional-cihanjuang",590,148],["tembusan gang awi",766,161],["bunderan pemkot",718,257],["pertigaan cibabat-sentral",378,192],["pertigaan nasional-pesantren",198,213],["pertigaan sentral-pesantren",272,316],["pertigaan cihanjuang-nur",672,378],["pertigaan nur-pesantren",457,394],["pertigaan sariwangi-gumil",221,440],["pertigaan asri-selatan",361,460],["pertigaan cihanjuang-lph",592,478],["perempatan endog",402,579],["pertigaan endog-gerlong",243,559],["gerbang polban 2",80,524],["pertigaan kec-sirnarasa",532,232],["pertigaan kec-pesantren",409,303],["pertigaan cihanjuang-sari",605,590]],"e":[[0,1,895,"berlubang",""],[1,2,295,"berlubang",""],[1,4,425,"gang","x"],[0,3,1020,"normal",""],[3,4,746,"normal",""],[3,5,1140,"jalan kecil","x"],[4,5,231,"normal",""],[2,5,615,"drainase","xx"],[3,6,565,"normal",""],[6,17,1110,"jalan kecil",""],[17,5,200,"normal",""],[6,7,722,"normal",""],[6,8,940,"jalan kecil",""],[7,8,839,"normal",""],[8,12,2720,"normal",""],[8,18,596,"normal",""],[18,17,516,"normal",""],[5,9,631,"normal",""],[18,10,605,"normal",""],[9,10,356,"banyak polisi tidur",""],[10,11,459,"berlubang",""],[11,16,2610,"berlubang",""],[11,12,806,"normal",""],[9,13,858,"normal",""],[13,12,1190,"jalan kecil",""],[13,19,305,"normal",""],[19,14,897,"banyak polisi tidur",""],[12,14,552,"berlubang",""],[12,15,611,"berlubang",""],[14,15,134,"jalan kecil",""],[15,16,928,"normal",""]]};
const KEC={"normal":40,"jalan kecil":20,"gang":10,"berlubang":15,"banyak polisi tidur":15,"drainase":null};
const $=id=>document.getElementById(id);
const N=D.n.length;
let S=0,E=N-2; // awal: rumah mail, tujuan: gerbang polban 2 (diatur di bawah)
S=D.n.findIndex(n=>n[0]==="rumah mail");E=D.n.findIndex(n=>n[0]==="gerbang polban 2");
const short=s=>s.replace("pertigaan ","Pt. ").replace("perempatan ","Prp. ");
const mode=()=>document.querySelector('input[name=m]:checked').value;
function kond(e){return (e[4]==="xx"&&$("xx").checked)?"normal":e[3]}
function speed(e){const k=KEC[kond(e)];return k===undefined?20:k}
function waktu(e){const v=speed(e);return v===null?Infinity:e[2]/1000/v*60}
function bobot(e){return mode()==="d"?(speed(e)===null?Infinity:e[2]):waktu(e)}
const adj=Array.from({length:N},()=>[]);
D.e.forEach((e,i)=>{adj[e[0]].push([e[1],i]);adj[e[1]].push([e[0],i])});
function dijkstra(a,b){
  const dist=Array(N).fill(Infinity),prev=Array(N).fill(null),done=Array(N).fill(false);
  dist[a]=0;
  for(let k=0;k<N;k++){
    let u=-1;for(let i=0;i<N;i++)if(!done[i]&&(u<0||dist[i]<dist[u]))u=i;
    if(u<0||dist[u]===Infinity)break;
    done[u]=true;if(u===b)break;
    for(const [v,ei] of adj[u]){const nd=dist[u]+bobot(D.e[ei]);if(nd<dist[v]){dist[v]=nd;prev[v]=[u,ei]}}
  }
  if(dist[b]===Infinity)return null;
  const path=[],eds=[];let c=b;
  while(c!==null){path.unshift(c);if(prev[c]){eds.unshift(prev[c][1]);c=prev[c][0]}else c=null}
  return {path,eds,total:dist[b]};
}
const fj=m=>m>=1000?(m/1000).toFixed(2)+" km":Math.round(m)+" m";
const fw=t=>t.toFixed(1)+" mnt";
function render(){
  $("s").value=S;$("e").value=E;
  const r=S!==E?dijkstra(S,E):null;
  const onE=new Set(r?r.eds:[]),onN=new Set(r?r.path:[]);
  let h="";
  D.e.forEach((e,i)=>{
    const a=D.n[e[0]],b=D.n[e[1]],cl=speed(e)===null;
    const cls=onE.has(i)?'stroke="var(--route)" stroke-width="6" stroke-linecap="round"':cl?'stroke="var(--warn)" stroke-width="2.5" stroke-dasharray="7 6"':'stroke="var(--road)" stroke-width="2"';
    h+=`<line x1="${a[1]}" y1="${a[2]}" x2="${b[1]}" y2="${b[2]}" ${cls}/>`;
  });
  D.e.forEach((e,i)=>{
    const a=D.n[e[0]],b=D.n[e[1]],w=bobot(e);
    const t=w===Infinity?"tertutup":mode()==="d"?fj(w):fw(w);
    h+=`<text x="${(a[1]+b[1])/2}" y="${(a[2]+b[2])/2+4}" text-anchor="middle" font-size="11" font-weight="${onE.has(i)?700:400}" fill="${onE.has(i)?"var(--route)":"var(--mute)"}" stroke="var(--halo)" stroke-width="4" paint-order="stroke">${t}</text>`;
  });
  D.n.forEach((n,i)=>{
    const f=i===S?"var(--start)":i===E?"var(--end)":onN.has(i)?"var(--route)":"var(--node)";
    h+=`<g class="nd" data-i="${i}" tabindex="0" role="button" aria-label="${n[0]}"><circle cx="${n[1]}" cy="${n[2]}" r="${i===S||i===E?13:10}" fill="${f}" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="${n[1]}" y="${n[2]-17}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" stroke="var(--halo)" stroke-width="4" paint-order="stroke">${short(n[0])}</text></g>`;
  });
  $("g").innerHTML=h;
  const R=$("res");
  if(S===E){R.innerHTML='<p class="err">Titik awal dan tujuan sama. Pilih tujuan yang berbeda.</p>';return}
  if(!r){R.innerHTML='<p class="err">Tidak ada jalur yang bisa dilewati antara dua titik ini. Coba aktifkan opsi mengabaikan ruas xx.</p>';return}
  let tw=0,td=0;r.eds.forEach(i=>{tw+=waktu(D.e[i]);td+=D.e[i][2]});
  let l="";
  r.eds.forEach((ei,k)=>{
    const e=D.e[ei];
    l+=`<li><b>${short(D.n[r.path[k]][0])} → ${short(D.n[r.path[k+1]][0])}</b><span><i class="chip">${kond(e)}</i>${e[4]?`<i class="chip">${e[4]}</i>`:""}${fj(e[2])}, ${fw(waktu(e))}</span></li>`;
  });
  R.innerHTML=`<div class="tot"><div><small>Waktu tempuh</small><div class="big">${tw.toFixed(1)} mnt</div></div><div><small>Jarak</small><div class="big">${(td/1000).toFixed(2)} km</div></div></div>
  <p class="hint" style="margin:0 0 6px">${r.eds.length} ruas dari ${D.n[S][0]} ke ${D.n[E][0]}, dioptimalkan menurut ${mode()==="d"?"jarak":"waktu"}.</p><ol>${l}</ol>`;
}
["s","e"].forEach(id=>{
  D.n.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=n[0];$(id).appendChild(o)});
});
$("s").onchange=()=>{S=+$("s").value;render()};
$("e").onchange=()=>{E=+$("e").value;render()};
$("swap").onclick=()=>{[S,E]=[E,S];render()};
$("xx").onchange=render;
document.querySelectorAll("input[name=m]").forEach(x=>x.onchange=render);
let picking=0; // 0: klik berikutnya = awal, 1: = tujuan
function pick(i){if(picking===0){S=i;picking=1}else{E=i;picking=0}render()}
$("g").addEventListener("click",ev=>{const g=ev.target.closest(".nd");if(g)pick(+g.dataset.i)});
$("g").addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){const g=ev.target.closest(".nd");if(g){ev.preventDefault();pick(+g.dataset.i)}}});
render();
</script>
</body>
</html>
